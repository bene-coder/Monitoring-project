name: CI

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main  

jobs:
  lint: 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    
    - name: Install Dependencies
      run: pip install ruff

    - name: Run Linter
      run: ruff check . 
      
  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r app/requirements.txt
      - run: pytest
          
