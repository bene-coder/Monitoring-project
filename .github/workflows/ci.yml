name: CI

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: ls -la
      - run: python3 --version
          
